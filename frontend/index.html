<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper-Reading-Agent</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <h1>Paper-Reading-Agent</h1>
        <p>输入论文信息，生成最小版本的论文阅读与学习规划结果。</p>
        <p id="service-status" class="status status-waiting">后端状态：等待检查</p>

        <form id="paper-form" class="paper-form">
          <label>
            论文标题
            <input id="paper-title" name="title" type="text" placeholder="例如：Attention Is All You Need" />
          </label>

          <label>
            论文摘要
            <textarea id="paper-abstract" name="abstract" rows="8" placeholder="粘贴论文摘要或关键内容"></textarea>
          </label>

          <label>
            论文正文 Markdown
            <textarea
              id="paper-markdown-body"
              name="markdown_body"
              rows="10"
              placeholder="粘贴论文正文、Markdown 笔记或关键章节内容"
            ></textarea>
          </label>

          <button type="submit">生成分析</button>
        </form>
      </section>

      <section class="panel">
        <h2>分析结果</h2>
        <pre id="result">等待输入...</pre>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
